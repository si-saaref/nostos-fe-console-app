    <!--
      THESIS: The conventional operator console, executed properly. It refuses
      metaphor, ornament and invention: an operator who has used any admin tool
      should need nothing explained. Familiarity is the commitment, not a retreat.
      OWN-WORLD: White cards on a light neutral page, 1px borders, 6-8px radii,
      restrained offset-plus-blur shadows, the navy top bar as the single brand
      accent, and status carried by pill plus colour pair. Libre Franklin.
      STORY: The operator arrives on an errand, scans cards or a table, acts, and
      gets a confirmation that cannot be mistaken for its opposite.
      FIRST VIEWPORT: Navy top bar; page title with the primary action opposite;
      a four-up row of metric cards; two cards below carrying what needs action.
      FORM: The category standard - the standing exit, taken deliberately by the
      operator after the rolled direction (The Register, seed da764555) was
      rejected. Craft bar set at Linear/Vercel. No smuggled quirk.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
      provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
